[project]
name = "octave-rl"
description = "Seeded GNU Octave coding curriculum with deterministic fractional rewards"
readme = "README.md"
tags = ["octave", "code", "rl", "train", "eval"]
version = "0.4.2"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.2.1,<0.3",
    "numpy>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "octave_rl.py",
    "executors.py",
    "generators.py",
    "harness.py",
    "pyproject.toml",
    "README.md",
]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
