# Test split -- held-out families
#
# The generalization read: these two families never appear in training, so a
# gain here cannot come from memorising a function body. Read it rarely --
# ideally once, at the end. Never gate promotion on it.
#
# Generated by hand for the 2026-08-09 family-holdout split. The three splits
# differ ONLY in `families` and `seed`; keep everything else identical or the
# comparison stops meaning anything.
model = "Qwen/Qwen3.5-4B"
num_tasks = 32
num_rollouts = 8
max_concurrent = 12
push = false
rich = false
max_turns = 1
output_dir = "outputs/octave-split-generalization"
max_total_tokens = 4096

[taskset]
id = "octave-rl"
level = 2
num_tasks = 500
seed = 20260808
families = ["reduce_along_dim", "reshape_permute"]
task = { octave_runtime = "local", user = { octave_runtime = "local", max_attempts = 1, guide_enabled = false } }

[harness]
id = "null"

[harness.runtime]
type = "subprocess"

[client]
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "PRIME_API_KEY"

[sampling]
temperature = 1.0
max_tokens = 1536
reasoning_effort = "none"

[timeout]
rollout = 600
finalize = 300
scoring = 60
