model = "Qwen/Qwen3.5-4B"
num_tasks = 10
num_rollouts = 1
max_concurrent = 5
push = false
rich = false
max_turns = 3
output_dir = "outputs/calibration/qwen-4b-level1-guided-three-turn"

[taskset]
id = "octave-rl"
level = 1
num_tasks = 20
seed = 42

[taskset.task]
second_attempt_multiplier = 0.85
guided_attempt_multiplier = 0.60

[taskset.task.user]
colocated = false
max_attempts = 3
guide_enabled = true
guide_model = "Qwen/Qwen3.5-35B-A3B"

[taskset.task.user.runtime]
type = "subprocess"

[harness]
id = "null"

[harness.runtime]
type = "subprocess"

[timeout]
rollout = 700.0
finalize = 420.0
scoring = 60.0

[sampling]
reasoning_effort = "none"
max_tokens = 1024
