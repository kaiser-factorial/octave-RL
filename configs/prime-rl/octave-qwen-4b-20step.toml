# Validated against prime-rl at commit
# 44539229436a23e624b0f39826014a4e58a703be with verifiers 0.2.1.
# Later prime-rl main uses the post-User interleaving-agent API and is not
# source-compatible with this environment's verifiers.v1 User simulator.
max_steps = 20
seq_len = 2048
output_dir = "training_outputs/octave-qwen-4b-20step"
clean_output_dir = true

[deployment]
type = "single_node"
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3.5-4B"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"

[orchestrator]
batch_size = 8
group_size = 8
tasks_per_minute = 8
collect_inference_metrics = false

[orchestrator.renderer]
name = "qwen3.5"

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 1024

[[orchestrator.train.env]]
name = "octave-level1-guided"
group_size = 8
taskset = { id = "octave-rl", level = 1, num_tasks = 500, seed = 314159, task = { second_attempt_multiplier = 0.85, guided_attempt_multiplier = 0.60, user = { colocated = false, max_attempts = 3, guide_enabled = true, guide_model = "Qwen/Qwen3.5-35B-A3B" } } }
harness = { id = "null", runtime = { type = "prime" } }
max_turns = 3
max_total_tokens = 4096
timeout = { rollout = 500, finalize = 120, scoring = 60 }
pool = { type = "elastic", max_workers = 1, multiplex = 8 }

[orchestrator.eval]
interval = 5
num_examples = 10
group_size = 1

[orchestrator.eval.sampling]
temperature = 0.0
max_completion_tokens = 1024

[[orchestrator.eval.env]]
name = "octave-level1-heldout"
taskset = { id = "octave-rl", level = 1, num_tasks = 50, seed = 271828, task = { second_attempt_multiplier = 0.85, guided_attempt_multiplier = 0.60, user = { colocated = false, max_attempts = 3, guide_enabled = true, guide_model = "Qwen/Qwen3.5-35B-A3B" } } }
harness = { id = "null", runtime = { type = "prime" } }
max_turns = 3
max_total_tokens = 4096
timeout = { rollout = 500, finalize = 120, scoring = 60 }
pool = { type = "elastic", max_workers = 1, multiplex = 4 }

[trainer]

[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
optim_cpu_offload = true

[trainer.model.lora]
rank = 16
alpha = 32
dropout = 0.0

[trainer.optim]
lr = 1e-5

[trainer.ckpt.weights]
save_adapter_separately = true

[ckpt]
interval = 10
keep_last = 1

[inference]
gpu_memory_utilization = 0.85

[inference.model]
# RTX 6000 Ada (SM89) hit illegal/misaligned CUDA accesses in vLLM's
# CUDA-graph and bundled FlashAttention-2 paths for Qwen3.5.
enforce_eager = true
max_model_len = 4096

[inference.vllm_extra]
attention_backend = "TRITON_ATTN"
