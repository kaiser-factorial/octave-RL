# ABLATION 2026-08-10 -- solved_only reward. Nemotron-3-Nano-30B-A3B, Level 1.
#
# UNVALIDATED. Do not launch this without a three-step smoke first. Every other
# config in this directory records settings that were observed to work; this one
# records settings that are *believed* to work, and the difference matters
# because the failures it can hit are silent rather than loud. Read the three
# hazards below before spending anything on it.
#
# Nemotron has only ever been used here through hosted Prime Inference, at
# evaluation, single-turn and multi-turn. It has never been trained, so there is
# no control run to pair this against and no measured topology to copy.
# Budgeting a control arm at the same settings is therefore part of the cost of
# this arm, not an optional extra.
#
# HAZARD 1 -- thinking is on by default, and getting it wrong looks like a
# capability result rather than an error. On the *train* client only
# `[orchestrator.renderer] enable_thinking = false` suppresses it;
# `reasoning_effort` is inert there. Measured on Qwen with thinking left on at a
# 1024-token cap: 87.9% truncation, format validity 0.12. `renderer.name` below
# is a guess -- prime-rl ships a renderer per model family and "nemotron" may not
# be one of them. If it is not, this run needs a renderer added upstream, or it
# must fall back to the hosted eval client, which cannot train. VERIFY FROM
# TRACES that `reasoning_content` is empty, never from the config:
# `SamplingConfig` sets `extra = "allow"` and forwards typos silently.
#
# HAZARD 2 -- topology. 30B A3B in BF16 is roughly 60 GB of weights, so neither
# the trainer nor the vLLM worker fits on the 48 GB RTX 6000 Ada cards every
# prior run used. This assumes 2x H100 80 GB and is tight on the inference side
# once KV cache is added; 2x H200 141 GB is the safe choice. At roughly $2.50-
# $3.50/GPU-hour that is a different cost class from the Qwen rungs -- estimate
# $15-25 for 20 steps against the ~$1.50-3 each Qwen arm costs.
#
# HAZARD 3 -- LoRA on a mixture-of-experts model. rank 16 / alpha 32 is carried
# over from the dense Qwen runs. Whether prime-rl's custom trainer targets the
# expert or the router projections here is unverified, and "trains but learns
# nothing" is the failure mode to expect if it targets the wrong ones.
#
# What the flag under test changes: a fully correct answer is worth 1.0 and
# everything else is worth 0.0, still discounted 0.85 / 0.60 by attempt.
# Per-case partial credit is the only channel through which an incorrect answer
# could earn anything -- there has been no execution or structured-output bonus
# since the 2026-08-05 hardening -- so this makes the reward strictly "right
# answer or nothing". `execution_fraction` and `correct_given_executed` are
# still reported, so the thing being un-rewarded is still measured.
#
# Why Nemotron is worth the trouble despite all of the above: at the training
# temperature it beats Qwen3.5-4B at every level (+0.275 / +0.240 / +0.064,
# p < 0.0001 / < 0.0001 / 0.015) and the mechanism is output discipline, not
# reasoning -- at T=1.0 Qwen fails to emit a parseable function on 45% of L3
# rollouts against Nemotron's 2%. A model that already writes runnable code is
# exactly the one on which "stop paying for code that merely runs" should show
# the smallest effect, which makes it the informative third point rather than a
# redundant one.
#
# Level 1 with the family holdout, three attempts and the 35B guide, matching
# the Qwen rungs. Nemotron's measured Level 1 solve rate in this scaffold is
# 0.570 at one turn -- above the 10-35% GRPO band, so expect a meaningful share
# of unanimous all-PASS groups here as well.
max_steps = 20
seq_len = 8192
output_dir = "training_outputs/octave-nemotron-20step-solved-only"
clean_output_dir = true

[deployment]
type = "single_node"
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"

# No [model.vlm] block: those attribute paths are Qwen-specific and Nemotron is
# not a VLM. Carrying them over would fault at model construction.

[orchestrator]
# Matched to the Qwen rungs so the three arms share a geometry. If the smoke
# shows the inference side saturating, drop group_size and max_inflight to 4
# together -- prime-rl enforces max_inflight_rollouts >= group_size.
batch_size = 16
group_size = 8
max_inflight_rollouts = 8
collect_inference_metrics = false

[orchestrator.renderer]
# GUESS. Confirm this name exists in the pinned prime-rl before launching; an
# unknown renderer name is the most likely way this config fails at startup,
# and a renderer that loads but ignores `enable_thinking` is the most likely way
# it fails silently.
name = "nemotron"
enable_thinking = false

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 1536

# TRAIN SPLIT, identical to the Qwen rungs: reduce_along_dim and reshape_permute
# are held out. If this list is edited, edit configs/eval/octave-split-*.toml to
# match or the holdout stops being held out.
[[orchestrator.train.env]]
name = "octave-level1-guided-local"
group_size = 8
taskset = { id = "octave-rl", families = ["logical_index", "broadcast_arith", "sliding_window", "linsolve_tolerance", "sequence_recurrence", "struct_cell_wrangle", "string_parse", "signal_identity"], level = 1, num_tasks = 500, seed = 314159, task = { octave_runtime = "local", reward_mode = "solved_only", second_attempt_multiplier = 0.85, guided_attempt_multiplier = 0.60, user = { colocated = false, max_attempts = 3, guide_enabled = true, guide_model = "Qwen/Qwen3.5-35B-A3B", octave_runtime = "local" } } }
harness = { id = "null", runtime = { type = "subprocess" } }
max_turns = 3
max_total_tokens = 6144
timeout = { rollout = 900, finalize = 300, scoring = 60 }
pool = { type = "elastic", max_workers = 1, multiplex = 2 }

[trainer]

[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
optim_cpu_offload = true

[trainer.model.lora]
# See HAZARD 3. Unverified against an MoE target module set.
rank = 16
alpha = 32
dropout = 0.0

[trainer.optim]
lr = 1e-5

[trainer.ckpt.weights]
save_adapter_separately = true

[ckpt]
interval = 5
keep_last = 3

[inference]
# Lower than the Qwen rungs' 0.85: 60 GB of weights on an 80 GB card leaves
# little headroom, and vLLM allocating KV cache up to 0.85 is how that becomes
# an OOM at the first long generation rather than at startup.
gpu_memory_utilization = 0.80

[inference.model]
# `enforce_eager` and TRITON_ATTN were SM89 workarounds for Qwen3.5 on RTX 6000
# Ada. On H100/H200 the defaults are expected to work and are faster; both are
# left off deliberately. If generation faults, reinstate them in that order.
max_model_len = 6144
