# ABLATION -- solved_only reward. Qwen3.5-0.8B, Level 1, batch 64 / group 8.
#
# ON HOLD as of 2026-08-10: parameterisation (0.5.0) takes priority, and shipping
# it invalidates every 0.4.x control including this arm's. Do not launch this
# before the pool question is settled -- see PARAMETERIZATION_DESIGN.md. The flag
# it exercises is merged and tested regardless.
#
# Paired with `octave-qwen-08b-20step-batch64.toml`. The ONLY difference is
# `reward_mode = "solved_only"` in the taskset's `task` table, so this is a
# paired comparison and not a fresh baseline.
#
# Batch 64, not the 16 the ladder used: at batch 16 / group 8 a step sees two
# tasks, and 6 of 20 steps came back fully degenerate on this model. This flag
# strictly reduces within-group spread -- a group where nothing is fully correct
# now has zero advantage even where partial credit would have separated its
# members -- so it makes that failure mode worse, and batch 16 risks a run that
# answers nothing. Batch 64 gives eight tasks per step.
#
# What the flag changes: a fully correct answer is worth 1.0 and everything else
# is worth 0.0, still discounted 0.85 / 0.60 by attempt. Per-case partial credit
# is the only channel through which an incorrect answer could earn anything --
# there has been no execution or structured-output bonus since the 2026-08-05
# hardening -- so this makes the reward strictly "right answer or nothing".
#
# Expected size of the change: small. On the 2026-07-29 distribution, 5 of 200
# rollouts were partially correct and carried about 6% of total reward mass. The
# hypothesis is not that mean reward moves, it is that removing the partial-credit
# gradient stops the policy from climbing toward "code that runs" instead of
# "code that is right". `execution_fraction` and `correct_given_executed` are
# still reported, so the thing being un-rewarded is still measured.
#
# Read the outcome from `solved` and `raw_case_fraction`, NEVER from reward: the
# two arms define reward differently, so their reward columns are not comparable
# by construction.
#
# Known cost of this flag, and itself a result worth recording: fewer groups
# carry gradient. A group in which no rollout is fully correct now has zero
# advantage even where partial credit would have separated its members, so the
# empty-batch count should rise above the control's 0 of 20 at this batch size.
# If it exceeds roughly 6 of 20 the run is telling you the reward is too sparse
# for this model at Level 1, which is itself the answer.
#
# Everything below is the control config unchanged, except `output_dir` and the
# added `reward_mode`.
#
# Twenty-step training run: Qwen3.5-0.8B, Level 1, group_size 8, BATCH 64.
#
# The first real training against the repaired taskset (0.3.x) with the family
# holdout in place. Promoted from the 2026-08-09 three-step smoke, which passed
# with zero errors and 50-100% of groups carrying gradient.
#
# Why 0.8B: on the repaired taskset it scores 0.107 reward / 0.117 solve rate on
# Level 1 in this exact scaffold, against 4B's 0.641 reward / 0.727 solve -- 4B has outgrown Level 1,
# 0.8B has not. It also has the best format_ok (0.64) and least truncation
# (2.5%) of the sizes measured, and costs a fifth of 4B to train.
# See artifacts/smaller-models-20260809/RESULTS.md.
#
# Why group_size 8 is not optional here: at a 0.117 solve rate, g=4 leaves ~69%
# of groups unanimous and therefore gradient-free. 0.8B's rollout dispersion is
# 1.40 -- close to independent, against 4B's 2.30 -- so a bigger group buys
# nearly what the theory predicts, taking that to roughly 0.37 at g=8.
#
# On group_size vs max_inflight_rollouts: prime-rl **enforces
# `max_inflight_rollouts >= group_size`** and refuses to start otherwise
# ("Value error, max_inflight_rollouts must be at least the number of rollouts
# per example"). The 2026-08-08 handoff advice to "raise group_size to 4-8 while
# holding max_inflight_rollouts = 2" is therefore not runnable. They are
# distinct knobs but not independent ones.
#
# That collides with a known hazard: the CUDA illegal-memory failures on this
# SM89 host came from 7-8 simultaneous long generations of Qwen3.5-**4B**.
# group_size 8 forces 8 simultaneous generations. We take that risk knowingly
# here because 0.8B is a fifth the size with a shorter p95 completion (695
# tokens against 4B's 825), so the memory pressure that produced those faults
# is far lower. If this run dies with an illegal memory access, that is the
# answer, and the fallback is group_size 4 / max_inflight 4.
#
# Deliberately matched to the historical 20-step run where it does not conflict
# with a known hazard, so a later comparison is apples-to-apples: Level 1 only,
# three attempts, guide before attempt three, LoRA rank 16, lr 1e-5.
#
# Deviations, each for a recorded reason:
#   - group_size 2 and max_inflight_rollouts 2 (not 8). The Qwen3.5 GDN worker
#     reproduced CUDA illegal-memory failures at 7-8 simultaneous long
#     generations on this SM89 host.
#   - No integrated eval. An eval env's multiplex does not constrain prime-rl's
#     global dispatcher, so integrated eval still launched 8 concurrent
#     requests. Evaluate a static checkpoint separately at concurrency one.
#   - enable_thinking = false at the renderer. `reasoning_effort` alone does not
#     suppress thinking; measured 87.9% truncation and format validity 0.12
#     when it is relied on.
#   - 1536 completion tokens / 6144 total, the tested envelope for three
#     attempts.
#   - octave_runtime = "local": candidates execute against the pinned Octave
#     10.2.0 rootfs on this host. Requires OCTAVE_RL_OCTAVE_ROOTFS.
#
# Validated against prime-rl @ 44539229436a23e624b0f39826014a4e58a703be.
max_steps = 20
# 8192, not 4096: every config here carried `seq_len` below `max_total_tokens`
# (6144), so the trainer ingested less than the rollout could generate. Tested at
# 8192 in the smoke with no cost and no instability. `max_total_tokens` stays at
# 6144 -- raising it to 10240 was measured and produced no benefit.
seq_len = 8192
output_dir = "training_outputs/octave-qwen-08b-20step-batch64-solved-only"
clean_output_dir = true

[deployment]
type = "single_node"
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3.5-0.8B"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"

[orchestrator]
batch_size = 64
group_size = 8
max_inflight_rollouts = 8
collect_inference_metrics = false

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = false

[orchestrator.train.sampling]
# T=1.0 keeps the sampled distribution equal to the one whose log-probs the
# trainer scores. Do not lower it to make tasks "harder" -- that biases the
# objective; change the task mix instead.
temperature = 1.0
max_completion_tokens = 1536

# TRAIN SPLIT. `families` excludes reduce_along_dim and reshape_permute, which are
# the generalization holdout -- see README "Train, validation, and test splits".
# If this list is edited, edit configs/eval/octave-split-*.toml to match, or the
# holdout stops being held out and the generalization number becomes meaningless.
[[orchestrator.train.env]]
name = "octave-level1-guided-local"
group_size = 8
taskset = { id = "octave-rl", families = ["logical_index", "broadcast_arith", "sliding_window", "linsolve_tolerance", "sequence_recurrence", "struct_cell_wrangle", "string_parse", "signal_identity"], level = 1, num_tasks = 500, seed = 314159, task = { octave_runtime = "local", reward_mode = "solved_only", second_attempt_multiplier = 0.85, guided_attempt_multiplier = 0.60, user = { colocated = false, max_attempts = 3, guide_enabled = true, guide_model = "Qwen/Qwen3.5-35B-A3B", octave_runtime = "local" } } }
harness = { id = "null", runtime = { type = "subprocess" } }
max_turns = 3
max_total_tokens = 6144
timeout = { rollout = 900, finalize = 300, scoring = 60 }
pool = { type = "elastic", max_workers = 1, multiplex = 2 }

[trainer]

[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
optim_cpu_offload = true

[trainer.model.lora]
rank = 16
alpha = 32
dropout = 0.0

[trainer.optim]
lr = 1e-5

[trainer.ckpt.weights]
save_adapter_separately = true

[ckpt]
# Every five steps: enough to retrieve a mid-run policy and to resume, without
# it is stopped early, and the adapter round-trip is part of the pass criteria.
interval = 5
keep_last = 3

[inference]
gpu_memory_utilization = 0.85

[inference.model]
# RTX 6000 Ada (SM89): vLLM's CUDA-graph init and bundled FlashAttention-2 path
# both fault on Qwen3.5. These two settings are the validated workaround.
enforce_eager = true
max_model_len = 6144

[inference.vllm_extra]
attention_backend = "TRITON_ATTN"
